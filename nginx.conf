# /etc/nginx/sites-available/portfolio
# Symlink: ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx

# ── Rate limit zone (iletişim formu için) ────────────────────────────────
# http bloğuna (nginx.conf içine) ekle, bu dosyaya değil:
# limit_req_zone $binary_remote_addr zone=contact:10m rate=3r/h;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name siteadi.com www.siteadi.com;

    return 301 https://siteadi.com$request_uri;
}

# ── www → non-www redirect ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.siteadi.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    return 301 https://siteadi.com$request_uri;
}

# ── Ana site ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siteadi.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Güvenli SSL ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/portfolio;
    client_max_body_size 15M;  # Medya yükleme limiti (appsettings ile tutarlı tut)

    # ── Güvenlik header'ları ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS — Cloudflare zaten sağlıyor ama lokal da ekle
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Static dosyalar (Nginx doğrudan serve eder — ASP.NET geçmez) ─────
    location /uploads/ {
        alias /var/www/portfolio/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Sadece resim dosyalarına izin ver
        location ~* \.(jpg|jpeg|png|webp|gif|svg|pdf)$ {
            try_files $uri =404;
        }
        # Diğer dosya tiplerine erişimi kapat
        location ~ {
            return 403;
        }
    }

    location /css/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /lib/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Rate limiting — sadece iletişim formu ────────────────────────────
    location = /hire/contact {
        limit_req zone=contact burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://localhost:5000;
        include /etc/nginx/proxy_params;
    }

    # ── Admin paneli — sadece belirli IP'den erişim (opsiyonel) ──────────
    # location /admin {
    #     allow 1.2.3.4;  # Senin IP'n
    #     deny all;
    #     proxy_pass http://localhost:5000;
    #     include /etc/nginx/proxy_params;
    # }

    # ── Ana uygulama — Kestrel'e proxy ───────────────────────────────────
    location / {
        proxy_pass http://localhost:5000;
        include /etc/nginx/proxy_params;

        # Gzip — sıkıştırma burada değil, aşağıdaki blokta
    }

    # ── Gzip sıkıştırma ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # ── Log ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/portfolio_access.log;
    error_log  /var/log/nginx/portfolio_error.log warn;
}

# ── Subdomain — web app örneği ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name muhasebe.siteadi.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    location / {
        proxy_pass http://localhost:5001;  # Bu web app farklı portta çalışır
        include /etc/nginx/proxy_params;
    }
}