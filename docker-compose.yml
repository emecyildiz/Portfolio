services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5432:5432" # Local pgAdmin/DBeaver access only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10            # 10 kez dener (50 saniye), hazır olana kadar web başlamaz

  web:
    build:
      context: .
      dockerfile: Dockerfile    # Visual Studio'nun oluşturduğu Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - AdminPath=${ADMIN_PATH:?ADMIN_PATH is required}
      - AdminEmail=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - AdminPassword=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    volumes:
      # wwwroot/uploads klasörü container dışına çıkar — container silinse bile görseller kalır
      - uploads:/app/wwwroot/uploads
      - dataprotection:/app/dataprotection-keys

volumes:
  pgdata:
  uploads:
  dataprotection:
