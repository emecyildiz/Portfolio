services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5432:5432" # Local pgAdmin/DBeaver access only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10            # Retry for up to 50 seconds before starting the web service

  web:
    build:
      context: .
      dockerfile: Dockerfile    # Dockerfile generated by Visual Studio
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - AdminPath=${ADMIN_PATH:?ADMIN_PATH is required}
      - AdminEmail=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - AdminPassword=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - Monitoring__WeeklyReportToken=${WEEKLY_REPORT_TOKEN:-}
      - TicketEmail__Enabled=${TICKET_EMAIL_ENABLED:-false}
      - TicketEmail__ApiKey=${TICKET_EMAIL_API_KEY:-}
      - TicketEmail__FromName=${TICKET_EMAIL_FROM_NAME:-Emecworks}
      - TicketEmail__FromAddress=${TICKET_EMAIL_FROM_ADDRESS:-}
      - TicketEmail__ReplyToAddress=${TICKET_EMAIL_REPLY_TO_ADDRESS:-}
      - TicketEmail__PublicBaseUrl=${TICKET_EMAIL_PUBLIC_BASE_URL:-https://emecworks.com}
      - TicketEmail__DailySendLimit=${TICKET_EMAIL_DAILY_SEND_LIMIT:-80}
      - TicketEmail__MaxPendingItems=${TICKET_EMAIL_MAX_PENDING_ITEMS:-120}
      - Turnstile__Enabled=${TURNSTILE_ENABLED:-false}
      - Turnstile__SiteKey=${TURNSTILE_SITE_KEY:-}
      - Turnstile__SecretKey=${TURNSTILE_SECRET_KEY:-}
      - Turnstile__ExpectedHostname=${TURNSTILE_EXPECTED_HOSTNAME:-emecworks.com}
      - Turnstile__ExpectedAction=${TURNSTILE_EXPECTED_ACTION:-contact}
    volumes:
      # Persist uploaded media outside the container so rebuilds do not remove it
      - uploads:/app/wwwroot/uploads
      - dataprotection:/app/dataprotection-keys
      - ./geoip:/app/geoip:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  uploads:
  dataprotection:
