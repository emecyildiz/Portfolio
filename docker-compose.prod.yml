services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # No host port: PostgreSQL is reachable only through the internal Docker network
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:8080" # Nginx connects to this port through localhost only
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - AllowedHosts=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - AdminPath=${ADMIN_PATH:?ADMIN_PATH is required}
      - AdminEmail=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - AdminPassword=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - Privacy__AnalyticsHashKey=${ANALYTICS_HASH_KEY:?ANALYTICS_HASH_KEY is required}
    volumes:
      - uploads:/app/wwwroot/uploads
      - dataprotection:/app/dataprotection-keys
      - ./geoip:/app/geoip:ro
    restart: unless-stopped

  proxy:
    image: caddy:2.11.4-alpine
    profiles:
      - public
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
  dataprotection:
  caddy_data:
  caddy_config:
