name: emecworks

services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # No host port: PostgreSQL is reachable only through the internal Docker network
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:8080" # Optional localhost-only diagnostic access
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - AllowedHosts=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - AdminPath=${ADMIN_PATH:?ADMIN_PATH is required}
      - AdminEmail=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - AdminPassword=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - Privacy__AnalyticsHashKey=${ANALYTICS_HASH_KEY:?ANALYTICS_HASH_KEY is required}
      - Privacy__ControllerName=${PRIVACY_CONTROLLER_NAME:-}
      - Privacy__ContactEmail=${PRIVACY_CONTACT_EMAIL:-}
      - Privacy__HostingProvider=${PRIVACY_HOSTING_PROVIDER:-}
      - Privacy__HostingCountry=${PRIVACY_HOSTING_COUNTRY:-}
      - Monitoring__WeeklyReportToken=${WEEKLY_REPORT_TOKEN:?WEEKLY_REPORT_TOKEN is required}
      - TicketEmail__Enabled=${TICKET_EMAIL_ENABLED:-false}
      - TicketEmail__ApiKey=${TICKET_EMAIL_API_KEY:-}
      - TicketEmail__FromName=${TICKET_EMAIL_FROM_NAME:-Emecworks}
      - TicketEmail__FromAddress=${TICKET_EMAIL_FROM_ADDRESS:-}
      - TicketEmail__ReplyToAddress=${TICKET_EMAIL_REPLY_TO_ADDRESS:-}
      - TicketEmail__PublicBaseUrl=${TICKET_EMAIL_PUBLIC_BASE_URL:-https://emecworks.com}
      - TicketEmail__DailySendLimit=${TICKET_EMAIL_DAILY_SEND_LIMIT:-80}
      - TicketEmail__MaxPendingItems=${TICKET_EMAIL_MAX_PENDING_ITEMS:-120}
      - Turnstile__Enabled=${TURNSTILE_ENABLED:-false}
      - Turnstile__SiteKey=${TURNSTILE_SITE_KEY:-}
      - Turnstile__SecretKey=${TURNSTILE_SECRET_KEY:-}
      - Turnstile__ExpectedHostname=${TURNSTILE_EXPECTED_HOSTNAME:-emecworks.com}
      - Turnstile__ExpectedAction=${TURNSTILE_EXPECTED_ACTION:-contact}
    volumes:
      - uploads:/app/wwwroot/uploads
      - dataprotection:/app/dataprotection-keys
      - ./geoip:/app/geoip:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  proxy:
    image: caddy:2.11.4-alpine
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      default:
      edge:
        aliases:
          - emecworks-gateway

volumes:
  pgdata:
  uploads:
  dataprotection:
  caddy_data:
  caddy_config:

networks:
  edge:
    name: emecworks-edge
    external: true
