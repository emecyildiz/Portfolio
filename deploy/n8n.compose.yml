services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    env_file:
      - /etc/emecworks/n8n-db.env
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.30.5@sha256:450853cd21a2ce36587c4c860eb26927c1ceba9496bf55f4c213b5d3a6dc8c6f
    env_file:
      - /etc/emecworks/n8n-app.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5678"
      - "5679"
    volumes:
      - n8n_data:/home/node/.n8n
      - /var/lib/emecworks/n8n-files:/home/node/.n8n-files
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
      edge:
        aliases:
          - n8n-app

  task-runners:
    image: docker.io/n8nio/runners:2.30.5-distroless@sha256:54a20704fc1812b69bead6f3259bea04cd99b8cc466277d44c33a5a08bd2e0a5
    env_file:
      - /etc/emecworks/n8n-runners.env
    depends_on:
      n8n:
        condition: service_healthy
    user: "65532:65532"
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=65532,gid=65532
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/opt/runners/task-runner-python/.venv/bin/python", "-I", "-B", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5680/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

volumes:
  n8n_pgdata:
  n8n_data:

networks:
  default:
    internal: true
  edge:
    name: emecworks-edge
    external: true
